<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hussein's Portfolio - Login</title>
    
    
     
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=Ruwudu&family=Sen:wght@800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="portfolio-container"> 
        
        
        <header class="navbar">
            <img class="logo" src="./img/logo.png" alt="Logo">
            
            <nav class="nav-links">
                <a href="index.html" class="nav-item">Home</a>
                <a href="about.html" class="nav-item">About</a>
                <a href="service.html" class="nav-item">services</a>
                <a href="project.html" class="nav-item">projects</a>
                <a href="contact.html" class="nav-item">contact</a>
            </nav>

            <div class="auth-buttons">
                <a href="login.html" class="auth-link">login</a>
                <a href="sign up.html" class="auth-link">sign up</a>
            </div>
        </header>

         
        <main class="login-wrapper">
            <section class="login-card">
                
                
                <div class="icon-box">
                    <img src="./icons/icons8-lock-26.png " alt="Login Badge Icon">
                </div>

                 
                <h1 class="login-title">Login</h1>
                <p class="login-subtitle">
                    Please enter your details<br>to access your account.
                </p>

                 
                <form class="login-form" action="#" method="POST">
                    
                    
                    <div class="input-group">
                        <img src="./icons/icons8-email-24.png " alt="Email Icon" class="input-icon">
                        <input type="email" placeholder="Email address" required>
                    </div>

                    
                    <div class="input-group">
                        <img src="./icons/icons8-lock-26 (1).png " alt="Password Icon" class="input-icon">
                        <input type="password" placeholder="Password" required>
                    </div>

                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span class="custom-checkbox"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forget password?</a>
                    </div>

                    
                    <button type="submit" class="btn-login">login</button>
                </form>

            </section>
        </main>

        
        <footer class="footer">
            <p>Copyright © 2026 by Hussein Kamal | All Rights Reserved.</p>
        </footer>

    </div>

</body>
</html>
